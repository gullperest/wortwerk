:root{

}

  --die:#f38891; --die-bg:#3f2025;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}

.app{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}

.status{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}

details.topics{border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.opt{text-align:left}

.list h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 4px}
.w{display:grid;grid-template-columns:2.4rem minmax(0,1.2fr) minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.w .a{font-weight:700}
.w .g{font-family:var(--word);font-weight:500;overflow-wrap:anywhere}
.w .g small{display:block;font-family:var(--ui);color:var(--muted);font-size:.82rem}
.w .e{color:var(--muted);min-width:0}

.install{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--mark-bg);border-radius:10px;padding:10px 14px;font-size:.92rem}

footer{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}

.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline}
</style>
</head>

const TOPICS = DATA.map((t,i)=>({id:i,de:t[0],en:t[1]}));
const WORDS = DATA.flatMap((t,i)=>t[2].split("\n").map(l=>{const [art,de,pl,en,ex]=l.split("|");return {art,de,pl,en,ex,topic:i};}));

// Ending patterns that reliably predict the article; shown only when they fit the word.
const RULES = [
  [/(ung|heit|keit|schaft|tion|tät|ei|ie|ur)$/, "die", m=>`Nouns ending in -${m} are feminine.`],
  [/(ment|um|chen|lein)$/, "das", m=>`Nouns ending in -${m} are neuter.`],
  [/nis$/, "das", ()=>"Most nouns ending in -nis are neuter."],
  [/^Ge/, "das", ()=>"Many nouns starting with Ge- are neuter."],
  [/(er|ling|ismus)$/, "der", m=>m==="er"?"Nouns in -er for people and jobs are masculine.":`Nouns ending in -${m} are masculine.`],
  [/e$/, "die", ()=>"Most nouns ending in -e are feminine."]
];
function tipFor(w){
  for(const [re,art,say] of RULES){const m=w.de.match(re); if(m && art===w.art) return say(m[1]||"");}
  return "";
}

const DAY=864e5, GAPS=[0,1,2,4,7,14], ROUND=10;
const MODES=[["cards","Cards"],["article","Artikel"],["meaning","Meaning"],["write","Write"],["list","Word list"]];
let store={p:{},topics:[],mode:"cards"};
try{const s=JSON.parse(localStorage.getItem("b1wortschatz")||"null"); if(s&&s.p) store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem("b1wortschatz",JSON.stringify(store));}catch(e){}}
const prog=w=>store.p[w.de]||{box:0,due:0};
function grade(w,ok){
  const p=prog(w); const box=ok?Math.min(5,p.box+1):1;
  store.p[w.de]={box,due:Date.now()+GAPS[box]*DAY}; save();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pool=()=>store.topics.length?WORDS.filter(w=>store.topics.includes(w.topic)):WORDS;
const canSpeak="speechSynthesis" in window;
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const sayBtn=w=>canSpeak?`<button class="say" data-act="say" data-t="${esc(w.art+" "+w.de)}">Listen</button>`:"";
const $=id=>document.getElementById(id);

let S=null, query="", confirmReset=false;
function newRound(){
  const now=Date.now(), all=pool();
  const due=shuffle(all.filter(w=>prog(w).box>0&&prog(w).due<=now)).sort((a,b)=>prog(a).box-prog(b).box);
  const fresh=shuffle(all.filter(w=>prog(w).box===0));
  const later=all.filter(w=>prog(w).box>0&&prog(w).due>now).sort((a,b)=>prog(a).due-prog(b).due);
  const queue=shuffle(due.concat(fresh,later).slice(0,ROUND));
  S={queue,i:0,size:queue.length,right:0,misses:[],retried:new Set(),phase:"ask",picked:null,opts:null,verdict:null};
  prep();
}
function prep(){
  S.phase="ask";S.picked=null;S.verdict=null;S.opts=null;
  const w=S.queue[S.i]; if(!w) return;
  if(store.mode==="meaning"){
    const others=shuffle(WORDS.filter(x=>x.en!==w.en)).slice(0,3).map(x=>x.en);
    S.opts=shuffle(others.concat(w.en));
  }
}
function answer(ok){
  const w=S.queue[S.i], first=!S.retried.has(w.de);
  grade(w,ok);
  if(first){ if(ok) S.right++; else {S.misses.push(w); S.retried.add(w.de); S.queue.push(w);} }
  S.phase="shown"; S.verdict=ok;
}
function next(){S.i++;prep();render();}

function renderStatus(){
  const all=pool(), now=Date.now();
  let m=0,l=0,d=0;
  all.forEach(w=>{const p=prog(w); if(p.box>=4)m++; else if(p.box>0)l++; if(p.box>0&&p.due<=now)d++;});
  const n=all.length;
  $("status").innerHTML=`<div class="bar" role="img" aria-label="${m} mastered, ${l} learning, ${n-m-l} new"><i class="m" style="width:${m/n*100}%"></i><i class="l" style="width:${l/n*100}%"></i></div>
  <div class="counts"><span><i class="dot m"></i><b>${m}</b> mastered</span><span><i class="dot l"></i><b>${l}</b> learning</span><span><i class="dot n"></i><b>${n-m-l}</b> new</span><span><b>${d}</b> due for review</span></div>`;
  $("topicsSum").textContent=store.topics.length?`${store.topics.length} of ${TOPICS.length} · ${n} words`:`All ${TOPICS.length} · ${n} words`;
}
function renderChrome(){
  $("chips").innerHTML=`<button class="chip" data-act="topic" data-id="all" aria-pressed="${!store.topics.length}">All topics</button>`+
    TOPICS.map(t=>`<button class="chip" data-act="topic" data-id="${t.id}" aria-pressed="${store.topics.includes(t.id)}" title="${esc(t.en)}">${esc(t.de)}</button>`).join("");
  $("modes").innerHTML=MODES.map(([id,label])=>`<button role="tab" data-act="mode" data-id="${id}" aria-selected="${store.mode===id}">${label}</button>`).join("");
  $("resetRow").innerHTML=confirmReset
    ?`<span>Erase progress for all ${WORDS.length} words?</span><button class="link" data-act="reset-yes">Yes, erase</button><button class="link" data-act="reset-no">Keep it</button>`
    :`<button class="link" data-act="reset">Reset my progress</button>`;
}
const head=w=>`<div class="meta"><span>${esc(TOPICS[w.topic].de)} · ${esc(TOPICS[w.topic].en)}</span><span>${Math.min(S.i+1,S.queue.length)} / ${S.queue.length}</span></div>`;
const full=w=>`<p class="big"><span class="art ${w.art}">${w.art}</span> ${esc(w.de)}</p><div class="sub">Plural: ${esc(w.pl==="–"?"not used":w.pl)}</div>`;
function reveal(w,withEn){
  const tip=tipFor(w);
  return `<div class="prompt ${w.art}">${full(w)}${withEn?`<div class="en">${esc(w.en)}</div>`:""}${sayBtn(w)}</div>
  <p class="ex">${esc(w.ex)}</p>${tip?`<div class="tip"><b>Pattern</b> ${esc(tip)}</div>`:""}`;
}
const nextBtn=`<div class="spacer"></div><div class="row"><button class="btn primary" data-act="next" id="nextBtn">Next <kbd>Enter</kbd></button></div>`;

function render(){
  renderStatus(); renderChrome();
  const st=$("stage");
  if(store.mode==="list"){ renderList(st); return; }
  if(!S) newRound();
  const w=S.queue[S.i];
  if(!w){
    st.innerHTML=`<div class="done"><h2>${S.right} of ${S.size} right first time</h2></div>`+
      (S.misses.length?`<div class="sub">Worth another look:</div><ul class="miss">${S.misses.map(x=>`<li><span><b class="${x.art}">${x.art}</b> ${esc(x.de)}</span><span class="sub">${esc(x.en)}</span></li>`).join("")}</ul>`:`<div class="sub">No misses in this round.</div>`)+
      `<div class="spacer"></div><div class="row"><button class="btn primary" data-act="again" id="nextBtn">Next round <kbd>Enter</kbd></button></div>`;
    return;
  }
  let h=head(w);
  if(store.mode==="cards"){
    if(S.phase==="ask"){
      h+=`<div class="prompt ${w.art}">${full(w)}${sayBtn(w)}</div><p class="ex">${esc(w.ex)}</p>
      <div class="spacer"></div><div class="row"><button class="btn primary" data-act="flip">Show English <kbd>Space</kbd></button></div>`;
    }else{
      h+=reveal(w,true)+`<div class="spacer"></div><div class="row"><button class="btn" data-act="rate" data-ok="0">Still learning <kbd>1</kbd></button><button class="btn primary" data-act="rate" data-ok="1">I knew it <kbd>2</kbd></button></div>`;
    }
  }
  if(store.mode==="article"){
    const done=S.phase==="shown";
    h+=done?reveal(w,true):`<div class="prompt"><p class="big">${esc(w.de)}</p><div class="en">${esc(w.en)}</div></div>`;
    if(done) h+=`<div class="verdict ${S.verdict?"ok":"no"}">${S.verdict?"Richtig!":`Not ${S.picked}. It is ${w.art} ${esc(w.de)}.`}</div>`;
    h+=`<div class="row">${["der","die","das"].map((a,i)=>`<button class="artbtn ${a} ${done&&a===w.art?"hit":""} ${done&&a===S.picked&&a!==w.art?"miss":""}" data-act="art" data-a="${a}" ${done?"disabled":""}>${a}</button>`).join("")}</div>`;
    h+=done?nextBtn:`<div class="sub">Pick the article, or press 1, 2 or 3.</div>`;
  }
  if(store.mode==="meaning"){
    const done=S.phase==="shown";
    h+=done?reveal(w,false):`<div class="prompt ${w.art}">${full(w)}${sayBtn(w)}</div>`;
    h+=`<div class="opts">${S.opts.map((o,i)=>`<button class="btn opt ${done&&o===w.en?"hit":""} ${done&&o===S.picked&&o!==w.en?"miss":""}" data-act="opt" data-i="${i}" ${done?"disabled":""}>${esc(o)}${done?"":` <kbd>${i+1}</kbd>`}</button>`).join("")}</div>`;
    if(done) h+=nextBtn;
  }
  if(store.mode==="write"){
    if(S.phase==="ask"){
      h+=`<div class="prompt"><div class="sub">Write it in German, with its article</div><p class="big">${esc(w.en)}</p></div>
      <form class="write" id="writeForm" autocomplete="off"><input id="answer" type="text" placeholder="der / die / das …" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="German word with article">
      <div class="keys">${["ä","ö","ü","ß"].map(k=>`<button type="button" data-act="key" data-k="${k}">${k}</button>`).join("")}</div>
      <div class="row"><button type="button" class="btn" data-act="giveup">I don't know</button><button class="btn primary" type="submit">Check <kbd>Enter</kbd></button></div></form>`;
    }else{
      h+=`<div class="verdict ${S.verdict?"ok":"no"}">${esc(S.picked)}</div>`+reveal(w,true)+nextBtn;
    }
  }
  st.innerHTML=h;
  const f=$("answer")||(S.phase==="shown"&&$("nextBtn")); if(f) f.focus({preventScroll:true});
}
function renderList(st){
  const q=query.trim().toLowerCase();
  const rows=pool().filter(w=>!q||(w.art+" "+w.de+" "+w.en).toLowerCase().includes(q));
  let h=`<input class="search" id="search" type="search" placeholder="Search German or English" value="${esc(query)}" aria-label="Search words"><div class="list" id="listRows">`;
  let last=-1;
  rows.forEach(w=>{
    if(w.topic!==last){last=w.topic;h+=`<h3>${esc(TOPICS[last].de)} · ${esc(TOPICS[last].en)}</h3>`;}
    const b=prog(w).box;
    h+=`<div class="w"><span class="a ${w.art}">${w.art}</span><span class="g">${esc(w.de)}<small>${w.pl==="–"?"no plural":esc(w.pl)}</small></span><span class="e">${esc(w.en)}</span><span class="lv" title="Level ${b} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span></div>`;
  });
  if(!rows.length) h+=`<p class="sub">No word matches “${esc(query)}”.</p>`;
  st.innerHTML=h+"</div>";
}
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
function checkWrite(val){
  const w=S.queue[S.i], v=norm(val), noun=norm(w.de);
  const ok=v===w.art+" "+noun;
  if(ok) S.picked="Richtig!";
  else if(v===noun) S.picked="Right noun, but the article is missing.";
  else if(/^(der|die|das) /.test(v)&&v.slice(4)===noun) S.picked=`Right noun, wrong article. You wrote “${v.slice(0,3)}”.`;
  else S.picked=val.trim()?`Not quite. You wrote “${val.trim()}”.`:"Here is the answer.";
  answer(ok); render();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="say") return say(b.dataset.t);
  if(a==="mode"){store.mode=b.dataset.id;save();S=null;return render();}
  if(a==="topic"){
    if(b.dataset.id==="all") store.topics=[];
    else{const id=+b.dataset.id,i=store.topics.indexOf(id); i<0?store.topics.push(id):store.topics.splice(i,1); if(store.topics.length===TOPICS.length) store.topics=[];}
    save();S=null;return render();
  }
  if(a==="reset"){confirmReset=true;return renderChrome();}
  if(a==="reset-no"){confirmReset=false;return renderChrome();}
  if(a==="reset-yes"){confirmReset=false;store.p={};save();S=null;return render();}
  if(a==="flip"){S.phase="shown";return render();}
  if(a==="rate"){answer(b.dataset.ok==="1");return next();}
  if(a==="art"){S.picked=b.dataset.a;answer(S.picked===S.queue[S.i].art);return render();}
  if(a==="opt"){S.picked=S.opts[+b.dataset.i];answer(S.picked===S.queue[S.i].en);return render();}
  if(a==="key"){const i=$("answer"),p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+b.dataset.k+i.value.slice(i.selectionEnd??p);i.focus();i.setSelectionRange(p+1,p+1);return;}
  if(a==="giveup") return checkWrite("");
  if(a==="next") return next();
  if(a==="again"){S=null;return render();}
});
document.addEventListener("submit",e=>{ if(e.target.id==="writeForm"){e.preventDefault();checkWrite($("answer").value);} });
document.addEventListener("input",e=>{
  if(e.target.id==="search"){query=e.target.value;renderList($("stage"));const s=$("search");s.focus();s.setSelectionRange(query.length,query.length);}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input")||e.metaKey||e.ctrlKey||e.altKey||store.mode==="list"||!S) return;
  const w=S.queue[S.i], k=e.key, click=sel=>{const el=document.querySelector(sel); if(el){e.preventDefault();el.click();}};
  if(k==="Enter"&&(!w||S.phase==="shown")&&store.mode!=="cards") return click("#nextBtn");
  if(!w){ if(k==="Enter") click("#nextBtn"); return; }
  if(store.mode==="cards"){
    if(S.phase==="ask"&&(k===" "||k==="Enter")) return click('[data-act="flip"]');
    if(S.phase==="shown"&&(k==="1"||k==="2")) return click(`[data-act="rate"][data-ok="${k==="2"?1:0}"]`);
  }
  if(S.phase==="ask"&&store.mode==="article"&&"123".includes(k)) return click(`[data-a="${["der","die","das"][k-1]}"]`);
  if(S.phase==="ask"&&store.mode==="meaning"&&"1234".includes(k)) return click(`[data-act="opt"][data-i="${k-1}"]`);
});
render();

// Install prompt and offline support
(function(){
  const box=$("install"), txt=$("installText"), btn=$("installBtn");
  let dismissed=false, deferred=null;
  try{dismissed=localStorage.getItem("b1install")==="no";}catch(e){}
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  function show(t,withBtn){ if(dismissed||standalone) return; txt.textContent=t; btn.hidden=!withBtn; box.hidden=false; }
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;show("Install Wortwerk on this device. It works offline.",true);});
  addEventListener("appinstalled",()=>{box.hidden=true;});
  btn.addEventListener("click",()=>{ if(deferred){deferred.prompt();deferred=null;box.hidden=true;} });
  $("installNo").addEventListener("click",()=>{box.hidden=true;try{localStorage.setItem("b1install","no");}catch(e){}});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)) show("To install: tap the Share button, then “Add to Home Screen”.",false);
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
