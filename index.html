<style>

}
footer{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
footer .row>*{flex:0 0 auto}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline}
</style>
</head>

const NOUN_TOPICS = DATA.map((t,i)=>({id:i,de:t[0],en:t[1]}));
const TOPICS = NOUN_TOPICS.concat([{id:DATA.length,de:"Verben",en:"Verbs"},{id:DATA.length+1,de:"Adjektive",en:"Adjectives"}]);
const plain=(src,kind,topic)=>src.split("\n").map(l=>{const [de,pl,en,ex,tr]=l.split("|");return {kind,art:"",de,pl,en,ex,tr,topic};});
const WORDS = DATA.flatMap((t,i)=>t[2].split("\n").map(l=>{const [art,de,pl,en,ex,tr]=l.split("|");return {kind:"noun",art,de,pl,en,ex,tr,topic:i};}))
  .concat(plain(VERBS,"verb",DATA.length),plain(ADJS,"adj",DATA.length+1));
const KINDS=[["noun","Nomen"],["verb","Verben"],["adj","Adjektive"]];
const INFO={noun:"Plural",verb:"Forms",adj:"Opposite"};
const label=w=>(w.art?w.art+" ":"")+w.de;

// Ending patterns that reliably predict the article; shown only when they fit the word.
const RULES = [
  [/(ung|heit|keit|schaft|tion|tät|ei|ie|ur)$/, "die", m=>`Nouns ending in -${m} are feminine.`],
  [/(ment|um|chen|lein)$/, "das", m=>`Nouns ending in -${m} are neuter.`],
  [/nis$/, "das", ()=>"Most nouns ending in -nis are neuter."],
  [/^Ge/, "das", ()=>"Many nouns starting with Ge- are neuter."],
  [/(er|ling|ismus)$/, "der", m=>m==="er"?"Nouns in -er for people and jobs are masculine.":`Nouns ending in -${m} are masculine.`],
  [/e$/, "die", ()=>"Most nouns ending in -e are feminine."]
];
function tipFor(w){
  if(w.kind!=="noun") return "";
  for(const [re,art,say] of RULES){const m=w.de.match(re); if(m && art===w.art) return say(m[1]||"");}
  return "";
}

const DAY=864e5, GAPS=[0,1,2,4,7,14], ROUND=10;
const MODES=[["cards","Cards"],["article","Artikel"],["meaning","Meaning"],["write","Write"],["list","Word list"]];
let store={p:{},topics:[],mode:"cards",kind:"noun",sound:true};
try{const s=JSON.parse(localStorage.getItem("b1wortschatz")||"null"); if(s&&s.p) store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem("b1wortschatz",JSON.stringify(store));}catch(e){}}
const prog=w=>store.p[w.de]||{box:0,due:0};
function grade(w,ok){
  const p=prog(w); const box=ok?Math.min(5,p.box+1):1;
  store.p[w.de]={box,due:Date.now()+GAPS[box]*DAY}; save();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pool=()=>{const k=WORDS.filter(w=>w.kind===store.kind);return store.kind==="noun"&&store.topics.length?k.filter(w=>store.topics.includes(w.topic)):k;};
const canSpeak="speechSynthesis" in window;
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const sayBtn=w=>canSpeak?`<button class="say" data-act="say" data-t="${esc(label(w))}">Listen</button>`:"";
const $=id=>document.getElementById(id);
let actx=null;
function tone(ok){
  if(store.sound===false) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime, notes=ok?[[659,0,.13],[988,.11,.24]]:[[208,0,.17],[156,.16,.3]];
    notes.forEach(([f,at,len])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=ok?"sine":"sawtooth"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+at); g.gain.linearRampToValueAtTime(ok?.25:.12,t+at+.015); g.gain.exponentialRampToValueAtTime(.0001,t+at+len);
      o.connect(g); g.connect(actx.destination); o.start(t+at); o.stop(t+at+len+.03);
    });
  }catch(e){}
}

let S=null, query="", confirmReset=false;
function newRound(){
  const now=Date.now(), all=pool();
  const due=shuffle(all.filter(w=>prog(w).box>0&&prog(w).due<=now)).sort((a,b)=>prog(a).box-prog(b).box);
  const fresh=shuffle(all.filter(w=>prog(w).box===0));
  const later=all.filter(w=>prog(w).box>0&&prog(w).due>now).sort((a,b)=>prog(a).due-prog(b).due);
  const queue=shuffle(due.concat(fresh,later).slice(0,ROUND));
  S={queue,i:0,size:queue.length,right:0,misses:[],retried:new Set(),phase:"ask",picked:null,opts:null,verdict:null,tr:false};
  prep();
}
function prep(){
  S.phase="ask";S.picked=null;S.verdict=null;S.opts=null;S.tr=false;
  const w=S.queue[S.i]; if(!w) return;
  if(store.mode==="write") S.tiles=shuffle(w.de.split(""));
  if(store.mode==="meaning"){
    const others=shuffle(WORDS.filter(x=>x.kind===w.kind&&x.en!==w.en)).slice(0,3).map(x=>x.en);
    S.opts=shuffle(others.concat(w.en));
  }
}
function answer(ok){
  const w=S.queue[S.i], first=!S.retried.has(w.de);
  grade(w,ok);
  if(store.mode!=="cards") tone(ok);
  if(first){ if(ok) S.right++; else {S.misses.push(w); S.retried.add(w.de); S.queue.push(w);} }
  S.phase="shown"; S.verdict=ok;
}
function next(){S.i++;prep();render();}

function stats(list){
  const now=Date.now(); let m=0,l=0,d=0;
  list.forEach(w=>{const p=prog(w); if(p.box>=4)m++; else if(p.box>0)l++; if(p.box>0&&p.due<=now)d++;});
  return {m,l,d,n:list.length};
}
const bar=s=>`<div class="bar" role="img" aria-label="${s.m} mastered, ${s.l} learning, ${s.n-s.m-s.l} new"><i class="m" style="width:${s.m/s.n*100}%"></i><i class="l" style="width:${s.l/s.n*100}%"></i></div>`;
function renderProfile(st){
  const all=stats(WORDS);
  st.innerHTML=`<div class="done"><h2>Profile</h2></div>
  <div class="profile">${bar(all)}<div class="counts"><span><i class="dot m"></i><b>${all.m}</b> mastered</span><span><i class="dot l"></i><b>${all.l}</b> learning</span><span><i class="dot n"></i><b>${all.n-all.m-all.l}</b> new</span><span><b>${all.d}</b> due</span></div></div>`+
  KINDS.map(([id,name])=>{const k=stats(WORDS.filter(w=>w.kind===id));return `<div class="profile"><div class="meta"><span>${name}</span><span>${k.m} / ${k.n}</span></div>${bar(k)}</div>`;}).join("")+
  `<div class="sub">Correct words return after 1, 2, 4, 7 and 14 days.</div><div class="spacer"></div><div class="row">`+
  (confirmReset
    ?`<button class="btn" data-act="reset-no">Keep progress</button><button class="btn primary" data-act="reset-yes">Erase everything</button>`
    :`<button class="btn" data-act="sound">Sound: ${store.sound===false?"off":"on"}</button><button class="btn" data-act="reset">Reset progress</button>`)+`</div>`;
}
function renderChrome(){
  const prof=store.mode==="profile", n=pool().length;
  $("profileBtn").setAttribute("aria-pressed",prof);
  $("kinds").hidden=prof;
  $("topicsSum").textContent=store.topics.length?`${store.topics.length} of ${NOUN_TOPICS.length}`:"All";
  $("chips").innerHTML=`<button class="chip" data-act="topic" data-id="all" aria-pressed="${!store.topics.length}">All topics</button>`+
    NOUN_TOPICS.map(t=>`<button class="chip" data-act="topic" data-id="${t.id}" aria-pressed="${store.topics.includes(t.id)}" title="${esc(t.en)}">${esc(t.de)}</button>`).join("");
  $("topicsBox").hidden=prof||store.kind!=="noun";
  $("kinds").innerHTML=KINDS.map(([id,name])=>`<button data-act="kind" data-id="${id}" aria-pressed="${store.kind===id}">${name}</button>`).join("");
  $("modes").innerHTML=MODES.filter(([id])=>id!=="article"||store.kind==="noun").map(([id,label])=>`<button role="tab" data-act="mode" data-id="${id}" aria-selected="${store.mode===id}">${label}</button>`).join("");
}
const head=w=>`<div class="meta"><span>${esc(TOPICS[w.topic].de)}</span><span>${Math.min(S.i+1,S.queue.length)} / ${S.queue.length}</span></div>`;
const info=w=>w.pl==="–"?(w.kind==="noun"?`<div class="sub">Plural: not used</div>`:""):`<div class="sub">${INFO[w.kind]}: ${esc(w.pl)}</div>`;
const full=w=>`<p class="big">${w.art?`<span class="art ${w.art}">${w.art}</span> `:""}${esc(w.de)}</p>${info(w)}`;
const exBlock=w=>`<div class="ex"><p lang="de">${esc(w.ex)}</p>${S.tr?`<p class="tr">${esc(w.tr)}</p>`:""}<button class="link" data-act="tr" aria-expanded="${S.tr}">${S.tr?"Hide translation":"Show English translation"}</button></div>`;
function reveal(w,withEn){
  const tip=tipFor(w);
  return `<div class="prompt ${w.art}">${full(w)}${withEn?`<div class="en">${esc(w.en)}</div>`:""}${sayBtn(w)}</div>
  ${exBlock(w)}${tip?`<div class="tip"><b>Pattern</b> ${esc(tip)}</div>`:""}`;
}
const nextBtn=`<div class="spacer"></div><div class="row"><button class="btn primary" data-act="next" id="nextBtn">Next <kbd>Enter</kbd></button></div>`;

function render(){
  renderChrome();
  const st=$("stage");
  if(store.mode==="profile"){ renderProfile(st); return; }
  if(store.mode==="list"){ renderList(st); return; }
  if(!S) newRound();
  const w=S.queue[S.i];
  if(!w){
    st.innerHTML=`<div class="done"><h2>${S.right} of ${S.size} right first time</h2></div>`+
      (S.misses.length?`<div class="sub">Worth another look:</div><ul class="miss">${S.misses.map(x=>`<li><span><b class="${x.art}">${x.art}</b> ${esc(x.de)}</span><span class="sub">${esc(x.en)}</span></li>`).join("")}</ul>`:`<div class="sub">No misses in this round.</div>`)+
      `<div class="spacer"></div><div class="row"><button class="btn primary" data-act="again" id="nextBtn">Next round <kbd>Enter</kbd></button></div>`;
    return;
  }
  let h=head(w);
  if(store.mode==="cards"){
    if(S.phase==="ask"){
      h+=`<div class="prompt ${w.art}">${full(w)}${sayBtn(w)}</div>${exBlock(w)}
      <div class="spacer"></div><div class="row"><button class="btn primary" data-act="flip">Show English <kbd>Space</kbd></button></div>`;
    }else{
      h+=reveal(w,true)+`<div class="spacer"></div><div class="row"><button class="btn" data-act="rate" data-ok="0">Still learning <kbd>1</kbd></button><button class="btn primary" data-act="rate" data-ok="1">I knew it <kbd>2</kbd></button></div>`;
    }
  }
  if(store.mode==="article"){
    const done=S.phase==="shown";
    h+=done?reveal(w,true):`<div class="prompt"><p class="big">${esc(w.de)}</p><div class="en">${esc(w.en)}</div></div>`;
    if(done) h+=`<div class="verdict ${S.verdict?"ok":"no"}">${S.verdict?"Richtig!":`Not ${S.picked}. It is ${w.art} ${esc(w.de)}.`}</div>`;
    h+=`<div class="row">${["der","die","das"].map((a,i)=>`<button class="artbtn ${a} ${done&&a===w.art?"hit":""} ${done&&a===S.picked&&a!==w.art?"miss":""}" data-act="art" data-a="${a}" ${done?"disabled":""}>${a}</button>`).join("")}</div>`;
    if(done) h+=nextBtn;
  }
  if(store.mode==="meaning"){
    const done=S.phase==="shown";
    h+=done?reveal(w,false):`<div class="prompt ${w.art}">${full(w)}${sayBtn(w)}</div>`;
    h+=`<div class="opts">${S.opts.map((o,i)=>`<button class="btn opt ${done&&o===w.en?"hit":""} ${done&&o===S.picked&&o!==w.en?"miss":""}" data-act="opt" data-i="${i}" ${done?"disabled":""}>${esc(o)}${done?"":` <kbd>${i+1}</kbd>`}</button>`).join("")}</div>`;
    if(done) h+=nextBtn;
  }
  if(store.mode==="write"){
    if(S.phase==="ask"){
      h+=`<div class="prompt"><div class="sub">${{noun:"Write it in German, with its article",verb:"Write the German verb (infinitive)",adj:"Write the German adjective"}[w.kind]}</div><p class="big">${esc(w.en)}</p></div>
      <form class="write" id="writeForm" autocomplete="off"><input id="answer" type="text" placeholder="${w.kind==="noun"?"der / die / das …":"Deutsch …"}" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="German word">
      ${w.art?`<div class="keys">${["der","die","das"].map(a=>`<button type="button" class="${a}" data-act="artkey" data-k="${a}">${a}</button>`).join("")}</div>`:""}
      <div class="keys" id="tiles">${S.tiles.map(c=>`<button type="button" data-act="key" data-k="${esc(c)}">${c===" "?"␣":esc(c)}</button>`).join("")}<button type="button" data-act="back" aria-label="Delete last letter">⌫</button></div>
      <div class="row"><button type="button" class="btn" data-act="giveup">I don't know</button><button class="btn primary" type="submit">Check <kbd>Enter</kbd></button></div></form>`;
    }else{
      h+=`<div class="verdict ${S.verdict?"ok":"no"}">${esc(S.picked)}</div>`+reveal(w,true)+nextBtn;
    }
  }
  st.innerHTML=h;
  const f=(matchMedia("(hover:hover)").matches&&$("answer"))||(S.phase==="shown"&&$("nextBtn")); if(f) f.focus({preventScroll:true});
}
function renderList(st){
  const q=query.trim().toLowerCase();
  const rows=pool().filter(w=>!q||(label(w)+" "+w.en).toLowerCase().includes(q));
  let h=`<input class="search" id="search" type="search" placeholder="Search German or English" value="${esc(query)}" aria-label="Search words"><div class="list" id="listRows">`;
  let last=-1;
  rows.forEach(w=>{
    if(w.topic!==last){last=w.topic;h+=`<h3>${esc(TOPICS[last].de)} · ${esc(TOPICS[last].en)}</h3>`;}
    const b=prog(w).box;
    h+=`<div class="w"><span class="a ${w.art}">${w.art}</span><span class="g">${esc(w.de)}<small>${w.pl==="–"?(w.kind==="noun"?"no plural":""):esc(w.pl)}</small></span><span class="e">${esc(w.en)}</span><span class="lv" title="Level ${b} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span></div>`;
  });
  if(!rows.length) h+=`<p class="sub">No word matches “${esc(query)}”.</p>`;
  st.innerHTML=h+"</div>";
}
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
// Grey out each letter tile once the answer field contains it.
function updateTiles(){
  const i=$("answer"), box=$("tiles"); if(!i||!box) return;
  let v=i.value; if(S.queue[S.i].art) v=v.replace(/^(der|die|das)\s*/i,"");
  const left=v.split(""), tiles=[...box.querySelectorAll("[data-k]")];
  tiles.forEach(b=>{b.disabled=false;});
  // exact letters first, so tapping "W" greys the capital tile, then typed lower-case letters
  [x=>x,x=>x.toLowerCase()].forEach(f=>tiles.forEach(b=>{
    if(b.disabled) return;
    const k=left.findIndex(c=>f(c)===f(b.dataset.k)); if(k>=0){b.disabled=true;left.splice(k,1);}
  }));
}
function checkWrite(val){
  const w=S.queue[S.i], v=norm(val), noun=norm(w.de);
  const ok=v===norm(label(w));
  if(ok) S.picked="Richtig!";
  else if(w.art&&v===noun) S.picked="Right noun, but the article is missing.";
  else if(w.art&&/^(der|die|das) /.test(v)&&v.slice(4)===noun) S.picked=`Right noun, wrong article. You wrote “${v.slice(0,3)}”.`;
  else S.picked=val.trim()?`Not quite. You wrote “${val.trim()}”.`:"Here is the answer.";
  answer(ok); render();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="say") return say(b.dataset.t);
  if(a==="mode"){store.mode=b.dataset.id;confirmReset=false;save();S=null;return render();}
  if(a==="topic"){
    if(b.dataset.id==="all") store.topics=[];
    else{const id=+b.dataset.id,i=store.topics.indexOf(id); i<0?store.topics.push(id):store.topics.splice(i,1); if(store.topics.length===NOUN_TOPICS.length) store.topics=[];}
    save();S=null;return render();
  }
  if(a==="kind"){store.kind=b.dataset.id;if(store.mode==="article"&&store.kind!=="noun")store.mode="cards";save();S=null;query="";return render();}
  if(a==="tr"){S.tr=!S.tr;return render();}
  if(a==="sound"){store.sound=store.sound===false;save();if(store.sound)tone(true);return render();}
  if(a==="reset"){confirmReset=true;return render();}
  if(a==="reset-no"){confirmReset=false;return render();}
  if(a==="reset-yes"){confirmReset=false;store.p={};save();S=null;return render();}
  if(a==="flip"){S.phase="shown";return render();}
  if(a==="rate"){answer(b.dataset.ok==="1");return next();}
  if(a==="art"){S.picked=b.dataset.a;answer(S.picked===S.queue[S.i].art);return render();}
  if(a==="opt"){S.picked=S.opts[+b.dataset.i];answer(S.picked===S.queue[S.i].en);return render();}
  if(a==="key"){$("answer").value+=b.dataset.k;return updateTiles();}
  if(a==="artkey"){const i=$("answer");i.value=b.dataset.k+" "+i.value.replace(/^(der|die|das)\s*/i,"");return updateTiles();}
  if(a==="back"){const i=$("answer");i.value=i.value.slice(0,-1);return updateTiles();}
  if(a==="giveup") return checkWrite("");
  if(a==="next") return next();
  if(a==="again"){S=null;return render();}
});
document.addEventListener("submit",e=>{ if(e.target.id==="writeForm"){e.preventDefault();checkWrite($("answer").value);} });
document.addEventListener("input",e=>{
  if(e.target.id==="answer") updateTiles();
  if(e.target.id==="search"){query=e.target.value;renderList($("stage"));const s=$("search");s.focus();s.setSelectionRange(query.length,query.length);}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input")||e.metaKey||e.ctrlKey||e.altKey||store.mode==="list"||store.mode==="profile"||!S) return;
  const w=S.queue[S.i], k=e.key, click=sel=>{const el=document.querySelector(sel); if(el){e.preventDefault();el.click();}};
  if(k==="Enter"&&(!w||S.phase==="shown")&&store.mode!=="cards") return click("#nextBtn");
  if(!w){ if(k==="Enter") click("#nextBtn"); return; }
  if(store.mode==="cards"){
    if(S.phase==="ask"&&(k===" "||k==="Enter")) return click('[data-act="flip"]');
    if(S.phase==="shown"&&(k==="1"||k==="2")) return click(`[data-act="rate"][data-ok="${k==="2"?1:0}"]`);
  }
  if(S.phase==="ask"&&store.mode==="article"&&"123".includes(k)) return click(`[data-a="${["der","die","das"][k-1]}"]`);
  if(S.phase==="ask"&&store.mode==="meaning"&&"1234".includes(k)) return click(`[data-act="opt"][data-i="${k-1}"]`);
});
render();

// Install prompt and offline support
(function(){
  const box=$("install"), txt=$("installText"), btn=$("installBtn");
  let dismissed=false, deferred=null;
  try{dismissed=localStorage.getItem("b1install")==="no";}catch(e){}
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  function show(t,withBtn){ if(dismissed||standalone) return; txt.textContent=t; btn.hidden=!withBtn; box.hidden=false; }
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;show("Install Wortwerk on this device. It works offline.",true);});
  addEventListener("appinstalled",()=>{box.hidden=true;});
  btn.addEventListener("click",()=>{ if(deferred){deferred.prompt();deferred=null;box.hidden=true;} });
  $("installNo").addEventListener("click",()=>{box.hidden=true;try{localStorage.setItem("b1install","no");}catch(e){}});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)) show("To install: tap the Share button, then “Add to Home Screen”.",false);
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
