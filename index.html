<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
/* Layout: one narrow working column — status strip, mode switch, a single practice stage. Gender colour (der/die/das) is the only loud element. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --sunk:#e2e7ec; --line:#cdd5dd;
  --ink:#15212c; --muted:#5a6875;
  --der:#1c5fc4; --der-bg:#e3edfb;
  --die:#c22f3c; --die-bg:#fbe6e8;
  --das:#1b7f52; --das-bg:#e0f3ea;
  --mark:#b77a00; --mark-bg:#fbf0d2;
  --ui:"Barlow","Helvetica Neue",Arial,sans-serif;
  --word:"Bitter",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#19222b; --sunk:#222d38; --line:#33414f;
    --ink:#e7edf2; --muted:#96a4b1;
    --der:#78abf7; --der-bg:#1b2c45;
    --die:#f38891; --die-bg:#3f2025;
    --das:#62cf9d; --das-bg:#17362a;
    --mark:#e9b84a; --mark-bg:#3a2f14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#19222b; --sunk:#222d38; --line:#33414f;
  --ink:#e7edf2; --muted:#96a4b1;
  --der:#78abf7; --der-bg:#1b2c45;
  --die:#f38891; --die-bg:#3f2025;
  --das:#62cf9d; --das-bg:#17362a;
  --mark:#e9b84a; --mark-bg:#3a2f14;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.app{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px}
h1{font-family:var(--word);font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em}
h1 span{color:var(--muted);font-family:var(--ui);font-weight:500;font-size:.95rem;letter-spacing:0;margin-left:.4em}
.legend{display:flex;gap:10px;font-weight:600;font-size:.9rem}
.der{color:var(--der)} .die{color:var(--die)} .das{color:var(--das)}

.status{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.bar .m{background:var(--das)} .bar .l{background:var(--mark)}
.counts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.counts b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.4em}
.dot.m{background:var(--das)} .dot.l{background:var(--mark)} .dot.n{background:var(--line)}

details.topics{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.topics summary{padding:10px 14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
details.topics summary small{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 14px 14px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.modes{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.modes button{flex:1 1 auto;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-weight:600;color:var(--muted);white-space:nowrap}
.modes button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px;min-height:340px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-variant-numeric:tabular-nums}
.meta span:last-child{white-space:nowrap}
@media (hover:none){kbd{display:none}}
.prompt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-left:6px solid var(--line);padding-left:16px}
.prompt.der{border-color:var(--der)} .prompt.die{border-color:var(--die)} .prompt.das{border-color:var(--das)}
.prompt.der,.prompt.die,.prompt.das{color:var(--ink)}
.big{font-family:var(--word);font-weight:700;font-size:clamp(1.8rem,7vw,2.7rem);line-height:1.12;overflow-wrap:anywhere;margin:0}
.big .art{font-weight:500}
.sub{color:var(--muted);font-size:.98rem}
.en{font-size:1.2rem;font-weight:500}
.ex{background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ex p{margin:0;font-family:var(--word);font-weight:500;font-size:1.02rem}
.ex p.tr{font-family:var(--ui);font-weight:400;color:var(--muted);font-size:.98rem}
.ex .link{font-size:.85rem}
.kinds{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.kinds button{flex:1 1 0;min-width:0;border:0;background:transparent;padding:9px 1px;font-size:.95rem;border-radius:7px;font-weight:600;color:var(--muted)}
.kinds button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.kinds small{display:block;font-weight:500;font-size:.76rem;font-variant-numeric:tabular-nums}
.tip{font-size:.92rem;background:var(--mark-bg);border-radius:8px;padding:8px 12px}
.tip b{color:var(--mark)}
.say{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{flex:1 1 120px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;font-weight:600;text-align:center}
.btn.primary,.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#auxRow .btn{font-family:var(--word);font-size:1.15rem}
#auxRow.need .btn{border-color:var(--die)}
.btn kbd{font:inherit;font-size:.75rem;color:var(--muted);margin-left:.5em;font-weight:500}
.btn.primary kbd{color:inherit;opacity:.65}
.artbtn{border:2px solid;border-radius:12px;padding:16px 8px;font-family:var(--word);font-weight:700;font-size:1.5rem}
.artbtn.der{color:var(--der);background:var(--der-bg);border-color:var(--der)}
.artbtn.die{color:var(--die);background:var(--die-bg);border-color:var(--die)}
.artbtn.das{color:var(--das);background:var(--das-bg);border-color:var(--das)}
.artbtn:disabled,.opt:disabled{cursor:default}
.artbtn:disabled:not(.hit):not(.miss){opacity:.35}
.artbtn.miss{text-decoration:line-through;opacity:.7}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.opt{text-align:left}
.opt.hit{background:var(--das-bg);border-color:var(--das)}
.opt.miss{background:var(--die-bg);border-color:var(--die);text-decoration:line-through}
.verdict{font-weight:700}
.verdict.ok{color:var(--das)} .verdict.no{color:var(--die)}
form.write{display:flex;flex-direction:column;gap:10px}
form.write input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--word);font-size:1.2rem}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:40px;padding:8px 10px;font-family:var(--word);font-weight:700;font-size:1.05rem}
.keys button:disabled{opacity:.25;cursor:default}
.keys button.der{color:var(--der);border-color:var(--der)} .keys button.die{color:var(--die);border-color:var(--die)} .keys button.das{color:var(--das);border-color:var(--das)}
.profile{display:flex;flex-direction:column;gap:8px}
.today{margin-left:auto;font-size:.85rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
#profileBtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
.done h2{font-family:var(--word);margin:0;font-size:1.6rem}
ul.miss{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.miss li{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px}

.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.list h3{font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 4px}
.w{display:grid;grid-template-columns:2.4rem minmax(0,1.2fr) minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.w .a{font-weight:700}
.w .g{font-family:var(--word);font-weight:500;overflow-wrap:anywhere}
.w .g small{display:block;font-family:var(--ui);color:var(--muted);font-size:.82rem}
.w .e{color:var(--muted);min-width:0}
.lv{display:flex;gap:2px}
.lv i{width:6px;height:12px;border-radius:2px;background:var(--line)}
.lv i.on{background:var(--das)}
@media (max-width:520px){
  .stage{padding:16px}
  .kinds button{font-size:.82rem}
  .w{grid-template-columns:2.4rem minmax(0,1fr) auto}
  .w .e{grid-column:2 / -1;grid-row:2}
}
.install{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--mark-bg);border-radius:10px;padding:10px 14px;font-size:.92rem}
.install span{flex:1 1 200px;min-width:0}
.install .btn{padding:6px 14px}
@media (max-width:640px){
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .modes{position:fixed;left:0;right:0;bottom:0;z-index:5;flex-wrap:nowrap;border-radius:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .modes button{flex:1 1 0;min-width:0;padding:11px 2px;font-size:.84rem}
  .modes button[aria-selected="true"]{background:var(--sunk);box-shadow:none}
}
footer{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
footer .row>*{flex:0 0 auto}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline}
</style>

<body>

<div class="app">
  <header>
    <h1>Wortwerk <span>B1</span></h1>
    <span class="today" id="today" hidden></span>
    <button class="say" data-act="mode" data-id="profile" id="profileBtn">Profile</button>
  </header>
  <nav class="kinds" id="kinds" aria-label="Word type"></nav>
  <div class="install" id="install" hidden><span id="installText"></span><button class="btn primary" id="installBtn" hidden>Install</button><button class="link" id="installNo">Dismiss</button></div>
  <details class="topics" id="topicsBox">
    <summary><span>Topics</span><small id="topicsSum"></small></summary>
    <div class="chips" id="chips"></div>
  </details>
  <nav class="modes" role="tablist" id="modes"></nav>
  <main class="stage" id="stage"></main>
</div>

<script src="words.js"></script>
<script>
const NOUN_TOPICS = DATA.map((t,i)=>({id:i,de:t[0],en:t[1]}));
const TOPICS = NOUN_TOPICS.concat([{id:DATA.length,de:"Verben",en:"Verbs"},{id:DATA.length+1,de:"Adjektive",en:"Adjectives"},{id:DATA.length+2,de:"Andere Wörter",en:"Other words"},{id:DATA.length+3,de:"Meine Wörter",en:"My words"}]);
const plain=(src,kind,topic)=>src.split("\n").filter(Boolean).map(l=>{const [de,pl,en,ex,tr,lv]=l.split("|");return {kind,art:"",de,pl,en,ex,tr,lv,topic};});
const WORDS = DATA.flatMap((t,i)=>t[2].split("\n").map(l=>{const [art,de,pl,en,ex,tr,lv]=l.split("|");return {kind:"noun",art,de,pl,en,ex,tr,lv,topic:i};}))
  .concat(plain(VERBS,"verb",DATA.length),plain(ADJS,"adj",DATA.length+1),plain(OTHERS,"other",DATA.length+2));
const KINDS=[["noun","Nomen"],["verb","Verben"],["adj","Adjektive"],["other","Andere"],["mine","Meine"]];
const INFO={noun:"Plural",verb:"Forms",adj:"Opposite",other:"Use"};
const label=w=>(w.art?w.art+" ":"")+w.de;

// Ending patterns that reliably predict the article; shown only when they fit the word.
const RULES = [
  [/(ung|heit|keit|schaft|tion|tät|ei|ie|ur)$/, "die", m=>`Nouns ending in -${m} are feminine.`],
  [/(ment|um|chen|lein)$/, "das", m=>`Nouns ending in -${m} are neuter.`],
  [/nis$/, "das", ()=>"Most nouns ending in -nis are neuter."],
  [/^Ge/, "das", ()=>"Many nouns starting with Ge- are neuter."],
  [/(er|ling|ismus)$/, "der", m=>m==="er"?"Nouns in -er for people and jobs are masculine.":`Nouns ending in -${m} are masculine.`],
  [/e$/, "die", ()=>"Most nouns ending in -e are feminine."]
];
function tipFor(w){
  if(w.kind!=="noun"||w.pl==="nur Plural") return "";
  for(const [re,art,say] of RULES){const m=w.de.match(re); if(m && art===w.art) return say(m[1]||"");}
  return "";
}

const DAY=864e5, GAPS=[0,1,2,4,7,14], ROUND=10;
const MODES=[["cards","Cards"],["article","Artikel"],["perfekt","Perfekt"],["meaning","Meaning"],["write","Write"],["list","Word list"]];
let store={p:{},topics:[],mode:"cards",kind:"noun",sound:true,basics:false,exam:"",day:{d:"",n:0},mine:[]};
try{const s=JSON.parse(localStorage.getItem("b1wortschatz")||"null"); if(s&&s.p) store=Object.assign(store,s);}catch(e){}
// Words the learner typed in themselves ("Meine"): stored on the device, practised like the rest.
const mineWord=e=>({kind:"mine",art:e.art||"",de:e.de,pl:e.pl||"",en:e.en,ex:e.ex||"",tr:e.tr||"",lv:"B",sk:e.sk||"",topic:DATA.length+3});
if(!Array.isArray(store.mine)) store.mine=[];
store.mine.forEach(e=>WORDS.push(mineWord(e)));
function addMine(deRaw,enRaw,exRaw){
  let de=deRaw.trim().replace(/\s+/g," "), art=""; const en=enRaw.trim(), ex=exRaw.trim();
  const m=de.match(/^(der|die|das)\s+(.+)$/i); if(m){art=m[1].toLowerCase();de=m[2];}
  if(!de) return "Type the German word.";
  if(store.mine.some(x=>x.de.toLowerCase()===de.toLowerCase())) return "Already in your list.";
  // if the app already knows the word, borrow its article, forms, meaning and example
  const built=WORDS.filter(x=>x.kind!=="mine");
  const k=built.find(x=>x.de===de&&(!art||x.art===art))||built.find(x=>x.de.toLowerCase()===de.toLowerCase()&&(!art||x.art===art));
  const e=k?{art:k.art,de:k.de,pl:k.pl,sk:k.kind,en:en||k.en,ex:ex||k.ex,tr:ex?"":k.tr}:{art,de,pl:"",sk:"",en,ex,tr:""};
  if(!e.en) return "Add the English meaning.";
  store.mine.push(e); WORDS.push(mineWord(e)); save();
  return "";
}
function delMine(de){
  store.mine=store.mine.filter(x=>x.de!==de);
  const i=WORDS.findIndex(x=>x.kind==="mine"&&x.de===de); if(i>=0) WORDS.splice(i,1);
  delete store.p["my:"+de]; save();
}
function save(){try{localStorage.setItem("b1wortschatz",JSON.stringify(store));}catch(e){}}
// Own words keep their progress apart from the built-in entry of the same word.
const bk=w=>(w.kind==="mine"?"my:":"")+w.de;
const key=w=>(store.mode==="perfekt"?"perf:":"")+bk(w);
const prog=(w,k=key(w))=>store.p[k]||{box:0,due:0};
// "fährt ab · fuhr ab · ist abgefahren" -> {aux:"ist", mid:"", part:"abgefahren"}
const perf=w=>{const t=w.pl.split(" · ")[2].split(" ");return {aux:t[0],mid:t.slice(1,-1).join(" "),part:t[t.length-1]};};
const perfText=w=>{const f=perf(w);return "er "+[f.aux,f.mid,f.part].filter(Boolean).join(" ");};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
// Daily plan: spread the words not yet started over the days until the exam,
// keeping the last week free for revision when there is room for it.
function plan(){
  if(!store.exam) return null;
  const t=todayStr(), left=Math.round((new Date(store.exam+"T00:00")-new Date(t+"T00:00"))/DAY);
  const done=store.day&&store.day.d===t?store.day.n:0;
  const fresh=WORDS.filter(w=>w.kind!=="mine"&&active(w)&&!store.p[w.de]).length;
  const study=Math.max(1,left>14?left-7:left);
  return {left,done,target:left<0?0:Math.ceil((fresh+done)/study)};
}
function grade(w,ok){
  if(!store.p[key(w)]&&store.mode!=="perfekt"&&w.kind!=="mine"){const t=todayStr(); if(!store.day||store.day.d!==t) store.day={d:t,n:0}; store.day.n++;}
  const p=prog(w); const box=ok?Math.min(5,p.box+1):1;
  store.p[key(w)]={box,due:Date.now()+GAPS[box]*DAY}; save();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const active=w=>store.basics||w.lv!=="A";
const pool=()=>{const k=WORDS.filter(w=>w.kind===store.kind&&active(w));return store.kind==="noun"&&store.topics.length?k.filter(w=>store.topics.includes(w.topic)):k;};
const canSpeak="speechSynthesis" in window;
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const sayBtn=w=>canSpeak?`<button class="say" data-act="say" data-t="${esc(label(w))}">Listen</button>`:"";
const $=id=>document.getElementById(id);
// Answer sounds: generated once, then played through Web Audio so they start the instant you tap.
// <audio> is the fallback (slower to start), used where Web Audio is missing or would be silenced
// by the iPhone ring/silent switch (older iOS without the audioSession API).
const SR=22050, CLIPS={ok:[[[659,0,.14],[988,.12,.3]],false,1],no:[[[311,0,.18],[233,.17,.32]],true,1],next:[[[523,0,.09]],false,.8]};
function synth(notes,buzz){
  const n=Math.floor(SR*(Math.max(...notes.map(x=>x[1]+x[2]))+.05)), out=new Float32Array(n);
  for(let i=0;i<n;i++){
    const t=i/SR; let v=0;
    notes.forEach(([f,at,len])=>{const x=t-at; if(x<0||x>len) return; const env=Math.min(1,x/.004)*Math.exp(-2.2*x/len), ph=x*f; v+=env*(buzz?(2*(ph%1)-1)*.8:Math.sin(2*Math.PI*ph)*.8+Math.sin(4*Math.PI*ph)*.2);});
    out[i]=Math.max(-1,Math.min(1,v));
  }
  return out;
}
function wavUrl(pcm){
  const n=pcm.length, d=new DataView(new ArrayBuffer(44+n*2));
  const str=(o,t)=>[...t].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
  str(0,"RIFF");d.setUint32(4,36+n*2,true);str(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);
  d.setUint32(24,SR,true);d.setUint32(28,SR*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);str(36,"data");d.setUint32(40,n*2,true);
  for(let i=0;i<n;i++) d.setInt16(44+i*2,pcm[i]*32767,true);
  let bin=""; const u=new Uint8Array(d.buffer); for(let i=0;i<u.length;i++) bin+=String.fromCharCode(u[i]);

// Runs on every touch or key press so the audio engine is already awake when an answer is given.
function unlock(){

function playBuf(k){

function newRound(){
  const now=Date.now(), all=pool();
  const due=shuffle(all.filter(w=>prog(w).box>0&&prog(w).due<=now)).sort((a,b)=>prog(a).box-prog(b).box);
  const fresh=shuffle(all.filter(w=>prog(w).box===0));
  const later=all.filter(w=>prog(w).box>0&&prog(w).due>now).sort((a,b)=>prog(a).due-prog(b).due);
  const queue=shuffle(due.concat(fresh,later).slice(0,ROUND));

  prep();

function prep(){

  const w=S.queue[S.i]; if(!w) return;
  if(store.mode==="write") S.tiles=shuffle(w.de.split(""));
  if(store.mode==="perfekt"){S.tiles=shuffle(perf(w).part.split(""));S.aux=null;}
  if(store.mode==="meaning"){
    const others=shuffle(WORDS.filter(x=>(w.kind==="mine"||x.kind===w.kind)&&x.en!==w.en)).slice(0,3).map(x=>x.en);

}

function updateTiles(){
  const i=$("answer"), box=$("tiles"); if(!i||!box) return;
  let v=i.value; if(S.queue[S.i].art) v=v.replace(/^(der|die|das)\s*/i,"");
  const left=v.split(""), tiles=[...box.querySelectorAll("[data-k]")];
  tiles.forEach(b=>{b.disabled=false;});
  // exact letters first, so tapping "W" greys the capital tile, then typed lower-case letters
  [x=>x,x=>x.toLowerCase()].forEach(f=>tiles.forEach(b=>{
    if(b.disabled) return;
    const k=left.findIndex(c=>f(c)===f(b.dataset.k)); if(k>=0){b.disabled=true;left.splice(k,1);}

}
function checkPerf(val,gaveUp){

  const partOk=norm(val).replace(/^sich /,"")===norm(f.part), auxOk=S.aux===f.aux, ok=partOk&&auxOk&&!gaveUp;
  S.picked=ok?"Richtig!":gaveUp?"Here is the answer.":partOk?`Right participle, but this verb takes “${f.aux}”.`:auxOk?`“${f.aux}” is right, but the participle is different.`:"Not quite.";
  answer(ok); render();
}
function checkWrite(val){
  const w=S.queue[S.i], v=norm(val), noun=norm(w.de);
  const ok=v===norm(label(w));
  if(ok) S.picked="Richtig!";

  else if(w.art&&/^(der|die|das) /.test(v)&&v.slice(4)===noun) S.picked=`Right noun, wrong article. You wrote “${v.slice(0,3)}”.`;

  }
});
document.addEventListener("change",e=>{ if(e.target.id==="exam"){store.exam=e.target.value;save();render();} });
document.addEventListener("input",e=>{
  if(e.target.id==="answer") updateTiles();
  if(e.target.id==="search"){query=e.target.value;renderList($("stage"));const s=$("search");s.focus();s.setSelectionRange(query.length,query.length);}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input")||e.metaKey||e.ctrlKey||e.altKey||store.mode==="list"||store.mode==="profile"||!S) return;
  const w=S.queue[S.i], k=e.key, click=sel=>{const el=document.querySelector(sel); if(el){e.preventDefault();el.click();}};
  if(k==="Enter"&&(!w||S.phase==="shown")&&store.mode!=="cards") return click("#nextBtn");
  if(!w){ if(k==="Enter") click("#nextBtn"); return; }
  if(store.mode==="cards"){
    if(S.phase==="ask"&&(k===" "||k==="Enter")) return click('[data-act="flip"]');
    if(S.phase==="shown"&&(k==="1"||k==="2")) return click(`[data-act="rate"][data-ok="${k==="2"?1:0}"]`);
  }
  if(S.phase==="ask"&&store.mode==="article"&&"123".includes(k)) return click(`[data-a="${["der","die","das"][k-1]}"]`);
  if(S.phase==="ask"&&store.mode==="meaning"&&"1234".includes(k)) return click(`[data-act="opt"][data-i="${k-1}"]`);
});
render();

// Install prompt and offline support
(function(){
  const box=$("install"), txt=$("installText"), btn=$("installBtn");
  let dismissed=false, deferred=null;
  try{dismissed=localStorage.getItem("b1install")==="no";}catch(e){}
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  function show(t,withBtn){ if(dismissed||standalone) return; txt.textContent=t; btn.hidden=!withBtn; box.hidden=false; }
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;show("Install Wortwerk on this device. It works offline.",true);});
  addEventListener("appinstalled",()=>{box.hidden=true;});
  btn.addEventListener("click",()=>{ if(deferred){deferred.prompt();deferred=null;box.hidden=true;} });
  $("installNo").addEventListener("click",()=>{box.hidden=true;try{localStorage.setItem("b1install","no");}catch(e){}});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)) show("To install: tap the Share button, then “Add to Home Screen”.",false);
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
